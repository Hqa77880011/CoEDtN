[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coedtn"
version = "0.1.0"
description = "CoEDtN implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["coedtn*"]
